# Builds the Linux app and uploads the tarball as the `linux-x64` artifact.
# Called by ci.yml and release.yml, and by Foreseerr's release, which
# attaches the app to each Foreseerr release.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: "Version in the tarball's name (default: git describe)"
        type: string
        default: ''
      ref:
        description: "Commit, branch or tag of this repository to build (default: the caller's, or main when called from elsewhere)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      # Called from another repository, the default checkout would be that
      # repository: this one is named explicitly.
      - uses: actions/checkout@v5
        with:
          repository: selmant/foreseerr-player
          ref: ${{ inputs.ref || (github.repository == 'selmant/foreseerr-player' && github.sha) || 'main' }}
          fetch-depth: 0

      - name: Git identity (git am needs one)
        run: |
          git config --global user.name 'foreseerr-player ci'
          git config --global user.email 'ci@users.noreply.github.com'

      - name: Moonfin at the pin, with patches and overlay
        run: ./scripts/sync.sh

      # The Flutter release Moonfin's own CI builds this Moonfin with.
      - name: Flutter version
        id: flutter
        run: |
          version=$(sed -n "s/^  FLUTTER_VERSION: '\(.*\)'.*/\1/p" upstream/.github/workflows/build.yml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev \
            libmpv-dev libsecret-1-dev libasound2-dev libarchive-dev

      - name: Analyze our code
        working-directory: upstream
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib/foreseerr \
            lib/ui/screens/settings/panel/foreseerr_settings_screens.dart

      - name: Build
        run: ./scripts/build.sh

      - name: Package
        id: package
        run: echo "file=$(./scripts/package.sh ${{ inputs.version }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
